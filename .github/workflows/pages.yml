# プロトタイプを GitHub Pages へ公開する
#
# Pages の配り元（Settings → Pages → Source）は2択で、どちらが選ばれていても
# 同じものが出るようにしてある。
#   - Deploy from a branch … main の直下がそのまま配られる。
#     直下には index.html と obrier-person / boss / admin.html（?role= を付けて
#     v5 へ渡す薄い紙）を commit してあるので、この workflow を待たずに出る。
#   - GitHub Actions … ここで _site を組んで配る。中身は上と同じ並び。
name: Deploy prototype to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 走っている途中に次が来たら、古いほうは止める
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 入口・3つの役割ぶんを書き出す
        run: node tools/build-roles.mjs
      - name: 配るぶんだけ _site に集める
        run: |
          mkdir -p _site
          cp index.html obrier-person.html obrier-boss.html obrier-admin.html _site/
          touch _site/.nojekyll
          cp -r prototype asset design _site/
          rm -rf _site/prototype/dist
          ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
